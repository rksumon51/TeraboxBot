<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container { text-align: center; width: 100%; max-width: 500px; }
        #loader { margin-top: 30px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        video { width: 100%; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); background: #000; margin-bottom: 20px; }
        
        .btn {
            display: inline-block; background: #2563eb; color: white; padding: 12px 24px;
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            transition: 0.3s; width: 100%; box-sizing: border-box; text-align: center;
        }
        .btn:hover { background: #1d4ed8; }
        
        #log-box {
            text-align: left; background: #1e293b; padding: 10px; border-radius: 8px;
            font-size: 12px; color: #94a3b8; font-family: monospace; margin-top: 20px; max-height: 150px; overflow-y: auto;
        }
        .success-text { color: #22c55e; font-weight: bold; }
        .error-text { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loading Screen -->
        <div id="loader">
            <div class="spinner"></div>
            <h3 style="margin-bottom: 5px;">⏳ Hacking Terabox Server...</h3>
            <p style="color: #94a3b8; font-size: 13px; margin-top: 0;">Bypassing CORS & Cloudflare securely</p>
            
            <!-- Live Tracker Console -->
            <div id="log-box">Initializing bypass protocols...<br></div>
        </div>

        <!-- Video Player Screen -->
        <div id="player-section" style="display: none;">
            <video id="video-player" controls preload="metadata" playsinline></video>
            <a id="download-btn" href="#" class="btn" target="_blank" download>📥 Download Video (Full Speed)</a>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const teraUrl = urlParams.get('url');
        const logBox = document.getElementById('log-box');

        function log(msg) {
            logBox.innerHTML += msg + "<br>";
            logBox.scrollTop = logBox.scrollHeight;
        }

        function findDirectLink(data, keys) {
            if (typeof data === 'object' && data !== null) {
                for (let k in data) {
                    if (keys.includes(k.toLowerCase()) && typeof data[k] === 'string' && data[k].startsWith('http')) {
                        return data[k];
                    }
                    let res = findDirectLink(data[k], keys);
                    if (res) return res;
                }
            } else if (Array.isArray(data)) {
                for (let item of data) {
                    let res = findDirectLink(item, keys);
                    if (res) return res;
                }
            }
            return null;
        }

        async function extractVideo() {
            if (!teraUrl) {
                log("<span class='error-text'>❌ Error: No Terabox link found!</span>");
                return;
            }

            let shortCode = "";
            let match = teraUrl.match(/\/s\/([a-zA-Z0-9_-]+)/);
            if (match) shortCode = match[1];

            // 🔴 3 Powerful Worker APIs
            const apis = [
                "https://teraboxvideodownloader.nepcoderdevs.workers.dev/?url=" + encodeURIComponent(teraUrl),
                "https://terabox-dl.qtcloud.workers.dev/api/get-info?shorturl=" + shortCode,
                "https://terabox.hnn.workers.dev/api/get-info?shorturl=" + shortCode
            ];

            // 🔴 3 Global CORS Proxies (ব্রাউজারের সিকিউরিটি ভাঙার হাতিয়ার)
            const proxies = [
                "", // First try direct
                "https://api.allorigins.win/raw?url=", 
                "https://api.codetabs.com/v1/proxy?quest="
            ];

            let attemptCount = 1;

            for (let api of apis) {
                if (!shortCode && api.includes('shorturl=')) continue;

                for (let proxy of proxies) {
                    let fetchUrl = proxy ? proxy + encodeURIComponent(api) : api;
                    let proxyName = proxy ? "CORS Proxy" : "Direct Link";
                    
                    log(`[${attemptCount}] Trying API via ${proxyName}...`);
                    attemptCount++;
                    
                    try {
                        let response = await fetch(fetchUrl);
                        if (response.ok) {
                            let data = await response.json();
                            
                            // Extract direct link
                            let dlink = findDirectLink(data, ['dlink', 'link', 'direct_link', 'url', 'fast download']);
                            
                            if (dlink) {
                                log("<span class='success-text'>✅ Successfully Extracted Video Link!</span>");
                                showPlayer(dlink);
                                return;
                            } else {
                                log("⚠️ Response OK, but no video link inside.");
                            }
                        } else {
                            log(`❌ Blocked or Failed (Status: ${response.status})`);
                        }
                    } catch (e) {
                        log(`❌ Network/CORS Error`);
                    }
                }
            }
            
            log("<span class='error-text'>❌ All servers blocked. Link might be private or deleted!</span>");
        }

        function showPlayer(videoLink) {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('player-section').style.display = 'block';
                
                const player = document.getElementById('video-player');
                player.src = videoLink;
                
                const dlBtn = document.getElementById('download-btn');
                dlBtn.href = videoLink;
            }, 1000); // 1 sec delay to show success message
        }

        // Run instantly
        extractVideo();
    </script>
</body>
</html>
