<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container { text-align: center; width: 100%; max-width: 500px; }
        #loader { margin-top: 30px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        video, iframe { 
            width: 100%; height: 250px; border-radius: 12px; border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); background: #000; margin-bottom: 20px; 
        }
        
        .btn {
            display: inline-block; background: #2563eb; color: white; padding: 12px 24px;
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            transition: 0.3s; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 10px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-alt { background: #10b981; }
        .btn-alt:hover { background: #059669; }
        
        #log-box {
            text-align: left; background: #1e293b; padding: 10px; border-radius: 8px;
            font-size: 12px; color: #94a3b8; font-family: monospace; margin-top: 20px; max-height: 120px; overflow-y: auto;
        }
        .success-text { color: #22c55e; font-weight: bold; }
        .error-text { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loading Screen -->
        <div id="loader">
            <div class="spinner"></div>
            <h3 style="margin-bottom: 5px;">⏳ Processing Video...</h3>
            <p style="color: #94a3b8; font-size: 13px; margin-top: 0;">Establishing secure connection</p>
            
            <div id="log-box">Initializing bypass protocols...<br></div>
        </div>

        <!-- Custom Video Player (If Direct Link Found) -->
        <div id="custom-player-section" style="display: none;">
            <video id="video-player" controls preload="metadata" playsinline></video>
            <a id="download-btn" href="#" class="btn" target="_blank" download>📥 Download (Direct Link)</a>
        </div>

        <!-- Official Embed Player (If API is blocked) -->
        <div id="embed-player-section" style="display: none;">
            <h4 style="margin-top: 0; color: #facc15;">⚡ Premium Stream Ready</h4>
            <iframe id="terabox-iframe" allowfullscreen></iframe>
            <a id="alt-download-btn" href="#" class="btn btn-alt" target="_blank">📥 Alternative Download</a>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const teraUrl = urlParams.get('url');
        const logBox = document.getElementById('log-box');

        function log(msg) {
            logBox.innerHTML += msg + "<br>";
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 🔴 Permanent Fallback System (Official Iframe)
        function loadOfficialEmbed(shortCode) {
            log("<span class='error-text'>⚠️ Fast API Blocked. Switching to Official Terabox Player...</span>");
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('embed-player-section').style.display = 'block';
                
                // Terabox Official Embed Link
                document.getElementById('terabox-iframe').src = `https://www.terabox.app/sharing/embed?surl=${shortCode}`;
                
                // Alternative Downloader Website (100% working fallback)
                document.getElementById('alt-download-btn').href = `https://teraboxdownloader.site/?url=${encodeURIComponent(teraUrl)}`;
            }, 1000);
        }

        async function extractVideo() {
            if (!teraUrl) {
                log("<span class='error-text'>❌ Error: No Terabox link found!</span>");
                return;
            }

            let shortCode = "";
            let match = teraUrl.match(/\/s\/([a-zA-Z0-9_-]+)/);
            if (match) shortCode = match[1];

            log("🔄 Trying Fast Direct Link (CORS Proxy)...");
            
            try {
                // Best CORS Proxy + Working API
                let proxyUrl = "https://corsproxy.io/?" + encodeURIComponent("https://teraboxvideodownloader.nepcoderdevs.workers.dev/?url=" + teraUrl);
                let response = await fetch(proxyUrl);
                
                if (response.ok) {
                    let data = await response.json();
                    let dlink = data.dlink || data.direct_link || (data.response && data.response[0] ? data.response[0].link : null);
                    
                    if (dlink) {
                        log("<span class='success-text'>✅ Direct Link Extracted Successfully!</span>");
                        
                        setTimeout(() => {
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('custom-player-section').style.display = 'block';
                            document.getElementById('video-player').src = dlink;
                            document.getElementById('download-btn').href = dlink;
                        }, 500);
                        return;
                    }
                }
            } catch (e) {
                log("❌ Direct Link failed due to Browser Security.");
            }

            // 🔴 If fetch fails, load the unbreakable official player
            if (shortCode) {
                loadOfficialEmbed(shortCode);
            } else {
                log("<span class='error-text'>❌ Invalid Terabox Link!</span>");
            }
        }

        // Run instantly
        extractVideo();
    </script>
</body>
</html>
