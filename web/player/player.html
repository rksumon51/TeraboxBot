<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container { text-align: center; width: 100%; max-width: 500px; }
        #loader { margin-top: 50px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #3b82f6;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        video { width: 100%; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); background: #000; margin-bottom: 20px; }
        
        .btn {
            display: inline-block; background: #2563eb; color: white; padding: 12px 24px;
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            transition: 0.3s; width: 100%; box-sizing: border-box; text-align: center;
        }
        .btn:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-weight: bold; margin-top: 20px; background: #fee2e2; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loading Screen -->
        <div id="loader">
            <div class="spinner"></div>
            <h3>⏳ Extracting Video...</h3>
            <p style="color: #94a3b8; font-size: 14px;">Bypassing limits using your local IP. Please wait!</p>
        </div>

        <!-- Video Player Screen -->
        <div id="player-section" style="display: none;">
            <video id="video-player" controls preload="metadata" playsinline></video>
            <a id="download-btn" href="#" class="btn" target="_blank" download>📥 Download Video</a>
        </div>
        
        <div id="error-msg" class="error" style="display: none;"></div>
    </div>

    <script>
        // Telegram WebApp Ready
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const teraUrl = urlParams.get('url');

        // Smart JSON Parser function
        function findDirectLink(data, keys) {
            if (typeof data === 'object' && data !== null) {
                for (let k in data) {
                    if (keys.includes(k.toLowerCase()) && typeof data[k] === 'string' && data[k].startsWith('http')) {
                        return data[k];
                    }
                    let res = findDirectLink(data[k], keys);
                    if (res) return res;
                }
            } else if (Array.isArray(data)) {
                for (let item of data) {
                    let res = findDirectLink(item, keys);
                    if (res) return res;
                }
            }
            return null;
        }

        async function extractVideo() {
            if (!teraUrl) {
                showError("No Terabox link provided!");
                return;
            }

            // Public Worker APIs for Frontend (CORS Enabled)
            const apis = [
                "https://teraboxvideodownloader.nepcoderdevs.workers.dev/?url=" + encodeURIComponent(teraUrl),
                "https://terabox-dl.qtcloud.workers.dev/api/get-info?shorturl=" + (teraUrl.split('/s/')[1] || "")
            ];

            for (let api of apis) {
                try {
                    let response = await fetch(api);
                    if (response.ok) {
                        let data = await response.json();
                        
                        // Extracting using standard keys
                        let dlink = findDirectLink(data, ['dlink', 'link', 'direct_link', 'fast download']);
                        
                        if (dlink) {
                            showPlayer(dlink);
                            return; // Stop trying other APIs
                        }
                    }
                } catch (e) {
                    console.log("API Failed:", api);
                }
            }
            
            showError("❌ Failed to extract link. Cloudflare might be blocking or the link is invalid.");
        }

        function showPlayer(videoLink) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('player-section').style.display = 'block';
            
            const player = document.getElementById('video-player');
            player.src = videoLink;
            
            const dlBtn = document.getElementById('download-btn');
            dlBtn.href = videoLink;
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.style.display = 'block';
            errDiv.innerText = msg;
        }

        // Start extraction instantly
        extractVideo();
    </script>
</body>
</html>
