<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2>🛠️ Admin Panel</h2>
    
    <div class="card">
        <h3>👥 Total Users: <span id="userCount">Loading...</span></h3>
    </div>

    <div class="card">
        <h3>➕ Add Force Sub Channel</h3>
        <input type="text" id="chId" placeholder="Channel ID (e.g. @MyChannel)">
        <input type="text" id="chUrl" placeholder="Channel Link (https://t.me/...)">
        <button onclick="addSub()" class="btn-primary">Add Channel</button>
    </div>

    <div class="card">
        <h3>📋 Active Channels</h3>
        <ul id="subList">Loading...</ul>
    </div>

    <div class="card">
        <h3>📢 Broadcast Message</h3>
        <textarea id="bMsg" placeholder="Type message for all users..."></textarea>
        <button onclick="sendBroadcast()" class="btn-danger">Send Broadcast</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
