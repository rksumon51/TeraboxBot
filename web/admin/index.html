<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <h2>🛠️ Admin Dashboard</h2>
        
        <!-- Primary Owner Section -->
        <div class="card owner-card">
            <h3>👑 Primary Owner</h3>
            <p id="owner-status">Status: 🔒 Locked in Database</p>
            <small>এই আইডিটি কেউ পরিবর্তন বা রিমুভ করতে পারবে না।</small>
        </div>

        <!-- Add New Admin Section -->
        <div class="card">
            <h3>➕ Add New Admin</h3>
            <input type="number" id="new-admin-id" placeholder="Enter Telegram User ID">
            <select id="new-admin-role">
                <!-- Primary Owner অপশনটি হাইড করা আছে -->
                <option value="Co-Owner">Co-Owner</option>
                <option value="Manager">Manager</option>
                <option value="Editor">Editor</option>
            </select>
            <button onclick="addAdmin()">Add Admin</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
